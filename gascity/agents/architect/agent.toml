session = "tmux"
nudge = "Run gc hook --claim --json now. If it returns work, execute the claimed step using its instructions and the matching OMG skill's completion protocol, then check your hook again. Ordinary document work uses initiative complete-step, including human interruptions. If no work is available, yield."
append_fragments = ["omg-workflow", "omg-hindsight"]

[env]
HINDSIGHT_MEMORY = "1"
