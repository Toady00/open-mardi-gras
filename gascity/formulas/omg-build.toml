formula = "omg-build"
description = "Build pinned approved specs with OMG planning, implementation, testing, review and post-settlement reporting."

[requires]
formula_compiler = ">=2.0.0"
[vars.initiative]
required = true
[vars.operation]
required = true
[vars.omg_binding]
default = "omg"
[vars.approved_root]
required = true
[vars.approved_revision]
required = true
[vars.artifact_root]
required = true
[vars.push]
default = "false"
enum = ["true", "false"]
[vars.open_pr]
default = "false"
enum = ["true", "false"]

[[steps]]
id = "plan"
title = "Plan implementation directly from approved specs and review coverage"
metadata = { "omg.stage" = "plan", "omg.artifact_root" = "{{artifact_root}}", "omg.initiative" = "{{initiative}}", "omg.operation" = "{{operation}}", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope" }
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = "../assets/scripts/verify.sh"
timeout = "2m"
[[steps.children]]
id = "author-plan"
title = "Write execution plan and requirement index"
metadata = { "gc.run_target" = "{{omg_binding}}.architect" }
description_file = "../assets/workflows/omg-build/plan.md"
[[steps.children]]
id = "review-plan"
title = "Independently review plan against every approved requirement"
needs = ["author-plan"]
metadata = { "gc.run_target" = "{{omg_binding}}.reviewer" }
description_file = "../assets/workflows/omg-build/plan-review.md"

[[steps]]
id = "decompose"
title = "Create tracked implementation work and its convoy"
needs = ["plan"]
metadata = { "gc.run_target" = "{{omg_binding}}.architect", "omg.stage" = "decompose", "omg.artifact_root" = "{{artifact_root}}", "omg.initiative" = "{{initiative}}", "omg.operation" = "{{operation}}", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/omg-build/decompose.md"
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = "../assets/scripts/verify.sh"
timeout = "2m"

[[steps]]
id = "implement"
title = "Implement and test each tracked work item"
needs = ["decompose"]
metadata = { "gc.run_target" = "{{omg_binding}}.builder", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
[steps.drain]
context = "shared"
formula = "omg-work"
member_access = "exclusive"
on_item_failure = "skip_remaining"
[steps.drain.item]
single_lane = true

[[steps]]
id = "quality"
title = "Repair findings, test the integrated change, and independently review"
needs = ["implement"]
metadata = { "omg.stage" = "quality", "omg.artifact_root" = "{{artifact_root}}", "omg.initiative" = "{{initiative}}", "omg.operation" = "{{operation}}", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = "../assets/scripts/verify.sh"
timeout = "2m"
[[steps.children]]
id = "repair"
title = "Address required findings from the preceding attempt"
metadata = { "gc.run_target" = "{{omg_binding}}.builder" }
description_file = "../assets/workflows/omg-build/repair.md"
[[steps.children]]
id = "test"
title = "Verify integrated behavior at the current code revision"
needs = ["repair"]
metadata = { "gc.run_target" = "{{omg_binding}}.tester" }
description_file = "../assets/workflows/omg-build/test.md"
[[steps.children]]
id = "review"
title = "Review code, test evidence, and required findings"
needs = ["test"]
metadata = { "gc.run_target" = "{{omg_binding}}.reviewer" }
description_file = "../assets/workflows/omg-build/review.md"

[[steps]]
id = "omg-reconcile"
title = "Reconcile every approved requirement with verified implementation"
needs = ["quality"]
metadata = { "gc.run_target" = "{{omg_binding}}.architect", "omg.stage" = "reconcile", "omg.artifact_root" = "{{artifact_root}}", "omg.initiative" = "{{initiative}}", "omg.operation" = "{{operation}}", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/omg-build/reconcile.md"
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = "../assets/scripts/verify.sh"
timeout = "2m"

[[steps]]
id = "finalize"
title = "Record the verified revision and explicitly requested code publication"
needs = ["omg-reconcile"]
metadata = { "gc.run_target" = "{{omg_binding}}.builder", "omg.stage" = "finalize", "omg.artifact_root" = "{{artifact_root}}", "omg.initiative" = "{{initiative}}", "omg.operation" = "{{operation}}", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/omg-build/finalize.md"
[steps.check]
max_attempts = 1
[steps.check.check]
mode = "exec"
path = "../assets/scripts/verify.sh"
timeout = "2m"

[[steps]]
id = "omg-build-body"
title = "OMG build scope"
needs = ["finalize"]
metadata = { "gc.kind" = "scope", "gc.scope_name" = "omg-build-body", "gc.scope_role" = "body" }

[[steps]]
id = "omg-report"
title = "Commit the built-versus-spec report, including failed and blocked runs"
needs = ["omg-build-body"]
metadata = { "gc.kind" = "cleanup", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "teardown", "gc.run_target" = "{{omg_binding}}.architect", "omg.stage" = "report", "omg.artifact_root" = "{{artifact_root}}", "omg.initiative" = "{{initiative}}", "omg.operation" = "{{operation}}" }
description_file = "../assets/workflows/omg-build/report.md"
# Teardown runs after the root settles; a checked teardown keeps its control
# and attempts in the post-settlement tail, so the report gate never regrades
# the build and a failed report attempt stays recoverable on this step.
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = "../assets/scripts/verify.sh"
timeout = "2m"
