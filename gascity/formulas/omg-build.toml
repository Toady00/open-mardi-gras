formula = "omg-build"
description = "Explicitly requested build from pinned OMG specs, with native planning/build/review and post-settlement reporting."
extends = ["build-from-plan-base"]

[requires]
formula_compiler = ">=2.0.0"

[vars.initiative]
required = true
[vars.operation]
required = true
[vars.omg_binding]
default = "omg"
[vars.approved_root]
required = true
[vars.approved_revision]
required = true

[[steps]]
id = "omg-input"
title = "Bridge pinned OMG specs into native planning inputs"
metadata = { "gc.run_target" = "{{omg_binding}}.architect", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.build.artifact_schema" = "gc.build.requirements.v1", "gc.build.artifact_path_keys" = "gc.build.requirements_path,gc.var.requirements_path" }
description_file = "../assets/workflows/omg-build/input.md"
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "prepare-plan"
title = "Validate plan continuation inputs"
needs = ["omg-input"]
description_file = "../assets/workflows/build-from-plan-base/prepare-plan.md"
metadata = { "gc.run_target" = "gc.run-operator", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "plan"
title = "Produce implementation plan"
needs = ["prepare-plan"]
description_file = "../assets/workflows/build-from-plan-base/plan.md"
metadata = { "gc.run_target" = "gc.design-author", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan-review"
title = "Review implementation plan"
needs = ["plan"]
description_file = "../assets/workflows/build-from-plan-base/plan-review.md"
metadata = { "gc.run_target" = "gc.review-synthesizer", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "prepare-decompose"
title = "Validate decompose continuation inputs"
needs = ["plan-review"]
description_file = "../assets/workflows/build-from-plan-base/prepare-decompose.md"
metadata = { "gc.run_target" = "gc.run-operator", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "decompose"
title = "Create continuation implementation convoy"
needs = ["prepare-decompose"]
description_file = "../assets/workflows/build-from-decompose-base/decompose.md"
metadata = { "gc.run_target" = "gc.task-decomposer", "gc.build.artifact_schema" = "gc.build.decomposition.v1", "gc.build.artifact_path_keys" = "gc.build.decomposition_path,gc.var.decomposition_path", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "prepare-convoy"
title = "Validate implementation convoy"
needs = ["decompose"]
description_file = "../assets/workflows/build-from-decompose-base/prepare-convoy.md"
metadata = { "gc.run_target" = "gc.run-operator", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "implement"
title = "Drain continuation implementation convoy"
needs = ["prepare-convoy"]
condition = "{{drain_policy}} == separate"
description_file = "../assets/workflows/build-from-convoy-base/implement.md"
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
[steps.drain]
context = "separate"
formula = "do-work"
member_access = "exclusive"

[[steps]]
id = "implement-same-session"
title = "Drain continuation convoy in one shared session"
needs = ["prepare-convoy"]
condition = "{{drain_policy}} == same-session"
description_file = "../assets/workflows/build-from-convoy-base/implement-same-session.md"
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
[steps.drain]
context = "shared"
formula = "do-work-item"
on_item_failure = "skip_remaining"
member_access = "exclusive"
[steps.drain.item]
single_lane = true

[[steps]]
id = "prepare-review"
title = "Validate review continuation inputs"
needs = ["implement", "implement-same-session"]
description_file = "../assets/workflows/build-from-convoy-base/prepare-review.md"
metadata = { "gc.run_target" = "gc.run-operator", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "review"
title = "Review continuation implementation"
needs = ["prepare-review"]
description_file = "../assets/workflows/build-from-review-base/review.md"
metadata = { "gc.run_target" = "gc.implementation-reviewer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.review_report_path", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "repair-review"
title = "Repair or block continuation review findings"
needs = ["review"]
description_file = "../assets/workflows/build-from-review-base/repair-review.md"
metadata = { "gc.run_target" = "gc.run-operator", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "omg-reconcile"
title = "Reconcile implementation and verification against approved specs"
needs = ["repair-review"]
metadata = { "gc.run_target" = "{{omg_binding}}.architect", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/omg-build/reconcile.md"

[[steps]]
id = "finalize"
title = "Finalize continuation with spec reconciliation"
needs = ["omg-reconcile"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description_file = "../assets/workflows/omg-build/finalize.md"
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "publish"
title = "Optionally publish continuation result"
needs = ["finalize"]
description_file = "../assets/workflows/build-from-review-base/publish.md"
metadata = { "gc.run_target" = "gc.publisher", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "omg-build-body"
title = "Native build scope"
needs = ["publish"]
metadata = { "gc.kind" = "scope", "gc.scope_name" = "omg-build-body", "gc.scope_role" = "body" }

[[steps]]
id = "omg-report"
title = "Publish built-versus-spec outcome, including failed and blocked runs"
needs = ["omg-build-body"]
metadata = { "gc.kind" = "cleanup", "gc.scope_ref" = "omg-build-body", "gc.scope_role" = "teardown", "gc.run_target" = "{{omg_binding}}.architect" }
description_file = "../assets/workflows/omg-build/report.md"
